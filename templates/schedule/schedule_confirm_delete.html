{% extends 'base.html' %}
{% block title %}Supprimer le créneau — Study Task{% endblock %}
{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Confirmation</p>
        <h1>Supprimer ce créneau ?</h1>
        <p>{{ entry }}</p>
    </div>
</section>
<form method="post" class="card form-card narrow-card">
    {% csrf_token %}
    <p>Cette action supprimera uniquement le créneau d'emploi du temps.</p>
    <div class="actions-row">
        <button class="btn btn-danger" type="submit">Oui, supprimer</button>
        <a class="btn btn-secondary" href="{% url 'schedule:list' %}">Annuler</a>
    </div>
</form>
{% endblock %}
