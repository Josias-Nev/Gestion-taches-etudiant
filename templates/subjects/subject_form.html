{% extends 'base.html' %}
{% block title %}{{ title }} — Study Task{% endblock %}
{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Matières</p>
        <h1>{{ title }}</h1>
        <p>Renseignez les informations utiles pour retrouver vos cours rapidement.</p>
    </div>
</section>
<form method="post" class="card form-card" novalidate>
    {% csrf_token %}
    {% include 'partials/form_fields.html' %}
    <div class="actions-row">
        <button class="btn btn-primary" type="submit">Enregistrer</button>
        <a class="btn btn-secondary" href="{% if subject %}{% url 'subjects:detail' subject.pk %}{% else %}{% url 'subjects:list' %}{% endif %}">Annuler</a>
    </div>
</form>
{% endblock %}
