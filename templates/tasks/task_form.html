{% extends 'base.html' %}
{% block title %}{{ title }} — Study Task{% endblock %}
{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Tâches</p>
        <h1>{{ title }}</h1>
        <p>Définissez le type, la priorité, l'échéance et la charge de travail.</p>
    </div>
</section>
<form method="post" class="card form-card" novalidate>
    {% csrf_token %}
    {% include 'partials/form_fields.html' %}
    <div class="actions-row">
        <button class="btn btn-primary" type="submit">Enregistrer</button>
        <a class="btn btn-secondary" href="{% if task %}{% url 'tasks:detail' task.pk %}{% else %}{% url 'tasks:list' %}{% endif %}">Annuler</a>
    </div>
</form>
{% endblock %}
